openapi: 3.0.3
info:
  title: PageTurner E-Bookstore API
  version: 1.0.0
  description: |
    REST API for the PageTurner full-stack e-bookstore (Express 5, JSON file store).

    **Authentication.** Log in with `POST /auth/login` to receive a JWT (HS256, 2 hours, or 7 days when
    `remember: true`). Send it on protected routes as `Authorization: Bearer <token>`. Logging out revokes the token.

    **Errors.** Every error body is `{ "error": "message" }`. Validation failures (HTTP 400) also include a
    `details` object that maps field names to messages.

    **Server-side pricing.** Totals, tax (5%), reward-point discounts and payment amounts are always recomputed on
    the server. Amounts sent by a client are ignored.

    **Demo accounts** (created by `npm run seed`):
    `admin@bookstore.com` / `Admin@123` (role `admin`) and `user@bookstore.com` / `User@1234` (role `customer`).
servers:
  - url: http://127.0.0.1:4000/api
    description: Local API server (binds to 127.0.0.1 only)
  - url: http://localhost:5173/api
    description: Vite dev server proxy (same-origin path used by the React client)
tags:
  - name: Health
    description: Liveness check
  - name: Auth
    description: Login, current user and logout
  - name: Books
    description: Public catalog browsing and search
  - name: Categories
    description: Book categories
  - name: Cart
    description: Shopping cart (requires login)
  - name: Wishlist
    description: Wishlist (requires login)
  - name: Addresses
    description: Delivery addresses (requires login)
  - name: Payment
    description: Mock payment gateway (requires login)
  - name: Orders
    description: Checkout preview, order placement and history (requires login)
  - name: Recommendations
    description: Personalised and similar-book recommendations
  - name: Admin
    description: Catalog management and statistics (requires the admin role)

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Health check
      security: []
      responses:
        '200':
          description: The API is running.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  # ---------------------------------------------------------------- Auth
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in and receive a JWT
      description: |
        Validates the email and password, then returns a signed token and the user (without the password hash).
        Unknown email and wrong password return the same 401 message to prevent user enumeration.
        Rate limited to 20 attempts per 15 minutes per client.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              customer:
                summary: Customer login
                value:
                  email: user@bookstore.com
                  password: User@1234
              rememberMe:
                summary: Long-lived (7 day) token
                value:
                  email: user@bookstore.com
                  password: User@1234
                  remember: true
      responses:
        '200':
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                success:
                  value:
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example-payload.example-signature
                    user:
                      id: 2
                      name: Asha Verma
                      email: user@bookstore.com
                      role: customer
                      rewardPoints: 500
                      createdAt: '2024-02-10T00:00:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCredentials:
                  value:
                    error: Invalid email or password
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Get the signed-in user
      responses:
        '200':
          description: The current user, including the reward points balance.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Log out and revoke the current token
      description: The token's `jti` is added to an in-memory revocation list until it expires.
      responses:
        '200':
          description: Token revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                success:
                  value:
                    message: Logged out successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------- Books
  /books:
    get:
      tags: [Books]
      operationId: listBooks
      summary: List and filter books
      description: |
        Filters combine with AND. `category`, `author` and `publisher` accept comma-separated values.
        `category` matches a category name, slug or id.
      security: []
      parameters:
        - name: search
          in: query
          description: Case-insensitive match on title, author, publisher, category or ISBN. `q` is accepted as an alias.
          schema:
            type: string
        - name: category
          in: query
          description: Comma-separated category names, slugs or ids.
          schema:
            type: string
            example: fiction,fantasy
        - name: author
          in: query
          description: Comma-separated exact author names.
          schema:
            type: string
        - name: publisher
          in: query
          description: Comma-separated exact publisher names.
          schema:
            type: string
        - name: rating
          in: query
          description: Minimum rating. `minRating` is accepted as an alias.
          schema:
            type: number
            minimum: 0
            maximum: 5
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: sort
          in: query
          description: Sort order. Unknown values keep the default order.
          schema:
            type: string
            enum: [price_asc, price_desc, rating, newest]
        - name: featured
          in: query
          description: Only featured books when `true`.
          schema:
            type: string
            enum: ['true', 'false']
        - name: bestseller
          in: query
          description: Only bestsellers when `true`.
          schema:
            type: string
            enum: ['true', 'false']
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Page size (maximum 48).
          schema:
            type: integer
            minimum: 1
            maximum: 48
            default: 12
      responses:
        '200':
          description: A page of books.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookListResponse'
              examples:
                fantasyByPrice:
                  summary: GET /books?category=fantasy&sort=price_asc&limit=2
                  value:
                    items:
                      - id: 43
                        title: The Ember Crown
                        author: Aria Thornwood
                        category: Fantasy
                        categoryId: 8
                        publisher: Bluebird Books
                        price: 249
                        rating: 4.6
                        reviewCount: 812
                        stock: 30
                        image: /covers/43.svg
                        isbn: 978-1-11591-143-3
                        description: An epic adventure of magic, loyalty and courage in a world you will not want to leave.
                        deliveryDays: 3
                        publishedDate: '2024-05-14'
                        featured: true
                        bestseller: false
                        inStock: true
                        expectedDelivery: '2025-06-04T10:00:00.000Z'
                    page: 1
                    limit: 2
                    total: 6
                    totalPages: 3
        '500':
          $ref: '#/components/responses/InternalServerError'

  /books/search:
    get:
      tags: [Books]
      operationId: searchBooks
      summary: Instant search (top 10 matches)
      security: []
      parameters:
        - name: q
          in: query
          description: Search text (maximum 100 characters).
          schema:
            type: string
            maxLength: 100
          example: lantern
      responses:
        '200':
          description: Up to 10 matching books.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookSearchResponse'
        '400':
          description: Search query longer than 100 characters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tooLong:
                  value:
                    error: Search query too long
        '500':
          $ref: '#/components/responses/InternalServerError'

  /books/facets:
    get:
      tags: [Books]
      operationId: getBookFacets
      summary: Filter options (categories, authors, publishers, price range)
      security: []
      responses:
        '200':
          description: Facet values for the catalog filters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookFacets'
              examples:
                facets:
                  value:
                    categories:
                      - id: 1
                        name: Fiction
                        slug: fiction
                        color: '#2563EB'
                    authors: [Aria Thornwood, Maya Ellison]
                    publishers: [Bluebird Books, Northwind Press]
                    priceRange:
                      min: 199
                      max: 989
        '500':
          $ref: '#/components/responses/InternalServerError'

  /books/category/{category}:
    get:
      tags: [Books]
      operationId: listBooksByCategory
      summary: List all books in a category
      security: []
      parameters:
        - name: category
          in: path
          required: true
          description: Category name, slug or numeric id.
          schema:
            type: string
          example: science-technology
      responses:
        '200':
          description: Matching books. The list is empty when nothing matches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookSearchResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /books/{id}:
    get:
      tags: [Books]
      operationId: getBook
      summary: Get one book with related titles
      description: |
        Authentication is optional. When a valid token is sent, the first view of a book by that user is recorded
        and used by the recommendation engine.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookId'
      responses:
        '200':
          description: The book plus related and frequently-bought-together books.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetailsResponse'
        '404':
          description: Book not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    error: Book not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------- Categories
  /categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: List categories with book counts
      security: []
      responses:
        '200':
          description: All categories.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CategoryWithCount'
              examples:
                categories:
                  value:
                    items:
                      - id: 1
                        name: Fiction
                        slug: fiction
                        color: '#2563EB'
                        bookCount: 6
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------- Cart
  /cart:
    get:
      tags: [Cart]
      operationId: getCart
      summary: Get the cart with totals
      description: Items saved for later are listed but excluded from the summary. Tax is 5% of the subtotal.
      responses:
        '200':
          description: Cart items and summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
              examples:
                cart:
                  value:
                    items:
                      - id: 1
                        userId: 2
                        bookId: 1
                        quantity: 2
                        savedForLater: false
                        book:
                          id: 1
                          title: The Lantern Keeper
                          author: Maya Ellison
                          category: Fiction
                          categoryId: 1
                          publisher: Northwind Press
                          price: 399
                          rating: 4.5
                          reviewCount: 640
                          stock: 22
                          image: /covers/1.svg
                          isbn: 978-1-10037-101-1
                          description: A beautifully written story of family, memory and second chances.
                          deliveryDays: 3
                          publishedDate: '2023-03-10'
                          featured: true
                          bestseller: false
                    summary:
                      quantity: 2
                      subtotal: 798
                      tax: 39.9
                      total: 837.9
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Cart]
      operationId: addToCart
      summary: Add a book to the cart
      description: |
        Quantity defaults to 1 (maximum 10). If the book is already in the cart the quantity is increased, capped at
        10 and at the available stock, and the item is moved out of "saved for later".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToCartRequest'
            examples:
              addTwo:
                value:
                  bookId: 1
                  quantity: 2
      responses:
        '201':
          description: The updated cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          description: Validation failed, or the book is out of stock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation:
                  value:
                    error: Validation failed
                    details:
                      quantity: Quantity must be 1-10
                outOfStock:
                  value:
                    error: This book is out of stock
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Cart]
      operationId: clearCart
      summary: Remove every item from the cart
      responses:
        '200':
          description: The now-empty cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /cart/rebuy/{orderId}:
    post:
      tags: [Cart]
      operationId: rebuyOrder
      summary: Buy Again - rebuild the cart from a previous order
      description: |
        Replaces the whole cart with the items of one of the caller's orders. Books that are deleted or out of stock
        are skipped and returned by title in `skipped`.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          example: 1
      responses:
        '200':
          description: The rebuilt cart and the titles that could not be added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartRebuyResponse'
              examples:
                partial:
                  value:
                    items: []
                    summary:
                      quantity: 0
                      subtotal: 0
                      tax: 0
                      total: 0
                    skipped: [Rainy Day Robots]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Order not found, or it belongs to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    error: Order not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  /cart/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Cart row id (not the book id).
        schema:
          type: integer
          minimum: 1
        example: 1
    put:
      tags: [Cart]
      operationId: updateCartItem
      summary: Change quantity or save for later
      description: Both fields are optional. Quantity must be 1-10 and not above stock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartRequest'
            examples:
              quantity:
                value:
                  quantity: 3
              saveForLater:
                value:
                  savedForLater: true
      responses:
        '200':
          description: The updated cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          description: Invalid quantity or more than the available stock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badQuantity:
                  value:
                    error: Quantity must be 1-10
                stock:
                  value:
                    error: Only 4 in stock
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Cart item not found, or it belongs to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    error: Cart item not found
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Cart]
      operationId: removeCartItem
      summary: Remove one item from the cart
      responses:
        '200':
          description: The updated cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Cart item not found, or it belongs to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    error: Cart item not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------- Wishlist
  /wishlist:
    get:
      tags: [Wishlist]
      operationId: getWishlist
      summary: List wishlist items
      responses:
        '200':
          description: The caller's wishlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Wishlist]
      operationId: addToWishlist
      summary: Add a book to the wishlist
      description: Adding a book that is already on the wishlist is a no-op that still returns 201.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToWishlistRequest'
            examples:
              add:
                value:
                  bookId: 5
      responses:
        '201':
          description: The updated wishlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistResponse'
              examples:
                wishlist:
                  value:
                    items:
                      - id: 1
                        userId: 2
                        bookId: 5
                        addedAt: '2025-06-01T09:30:00.000Z'
                        book:
                          id: 5
                          title: Paper Cities
                          author: Tomas Reyes
                          category: Fiction
                          categoryId: 1
                          publisher: Meridian House
                          price: 329
                          rating: 4.1
                          reviewCount: 215
                          stock: 18
                          image: /covers/5.svg
                          isbn: 978-1-10185-105-5
                          description: A beautifully written story of family, memory and second chances.
                          deliveryDays: 4
                          publishedDate: '2023-08-21'
                          featured: false
                          bestseller: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /wishlist/{bookId}:
    delete:
      tags: [Wishlist]
      operationId: removeFromWishlist
      summary: Remove a book from the wishlist
      description: Always succeeds, even when the book was not on the wishlist.
      parameters:
        - $ref: '#/components/parameters/WishlistBookId'
      responses:
        '200':
          description: The updated wishlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /wishlist/{bookId}/move-to-cart:
    post:
      tags: [Wishlist]
      operationId: moveWishlistItemToCart
      summary: Move a wishlist book into the cart
      description: Adds one copy to the cart (quantity capped at 10 and at stock) and removes the wishlist entry.
      parameters:
        - $ref: '#/components/parameters/WishlistBookId'
      responses:
        '200':
          description: The updated wishlist (the moved book is gone).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistResponse'
        '400':
          description: The book is out of stock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                outOfStock:
                  value:
                    error: This book is out of stock
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The book is not on the caller's wishlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    error: Wishlist item not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------- Addresses
  /address:
    get:
      tags: [Addresses]
      operationId: listAddresses
      summary: List saved addresses
      responses:
        '200':
          description: The caller's addresses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Addresses]
      operationId: createAddress
      summary: Add an address
      description: "The first address becomes the default automatically. Send `isDefault: true` to make a later one the default."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
            examples:
              home:
                value:
                  fullName: Asha Verma
                  phone: '9876543210'
                  houseNumber: 42B
                  street: MG Road
                  city: Bengaluru
                  state: Karnataka
                  country: India
                  pincode: '560001'
                  isDefault: true
      responses:
        '201':
          description: All of the caller's addresses, including the new one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressListResponse'
              examples:
                created:
                  value:
                    items:
                      - id: 1
                        userId: 2
                        fullName: Asha Verma
                        phone: '9876543210'
                        houseNumber: 42B
                        street: MG Road
                        city: Bengaluru
                        state: Karnataka
                        country: India
                        pincode: '560001'
                        isDefault: true
        '400':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid:
                  value:
                    error: Validation failed
                    details:
                      phone: Enter a valid 10-digit mobile number
                      pincode: Enter a valid 6-digit pincode
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /address/{id}:
    parameters:
      - $ref: '#/components/parameters/AddressId'
    put:
      tags: [Addresses]
      operationId: updateAddress
      summary: Replace an address
      description: "All address fields are required again. Send `isDefault: true` to make it the default."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '200':
          description: All of the caller's addresses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/AddressNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Addresses]
      operationId: deleteAddress
      summary: Delete an address
      description: If the deleted address was the default, the first remaining address becomes the default.
      responses:
        '200':
          description: The remaining addresses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/AddressNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /address/{id}/default:
    put:
      tags: [Addresses]
      operationId: setDefaultAddress
      summary: Make an address the default
      parameters:
        - $ref: '#/components/parameters/AddressId'
      responses:
        '200':
          description: All of the caller's addresses with exactly one default.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/AddressNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------- Payment
  /payment:
    post:
      tags: [Payment]
      operationId: makePayment
      summary: Pay for the cart (mock gateway)
      description: |
        Validates the payment details, recomputes the payable amount from the server-side cart (minus any
        reward-point discount) and records a payment. Only a masked reference is stored, never the card number or CVV.

        The mock gateway approves everything except the test card `4000000000000002`, which is declined with 402.
        Use the returned `paymentId` in `POST /orders`. A payment can be used for one order only.
        Rate limited to 30 attempts per 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
            examples:
              creditCard:
                summary: Credit card
                value:
                  method: credit_card
                  details:
                    cardNumber: '4242424242424242'
                    cardName: Asha Verma
                    expiry: 12/30
                    cvv: '123'
                  pointsToRedeem: 100
              upi:
                summary: UPI
                value:
                  method: upi
                  details:
                    upiId: asha@okbank
              netBanking:
                summary: Net banking
                value:
                  method: net_banking
                  details:
                    bank: HDFC Bank
              wallet:
                summary: Wallet
                value:
                  method: wallet
                  details:
                    wallet: PayWallet
              declinedCard:
                summary: Test card that is always declined
                value:
                  method: credit_card
                  details:
                    cardNumber: '4000000000000002'
                    cardName: Asha Verma
                    expiry: 12/30
                    cvv: '123'
      responses:
        '201':
          description: Payment approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
              examples:
                approved:
                  value:
                    paymentId: 1
                    transactionId: TXN1717234567890123
                    amount: 737.9
                    status: success
                    method: credit_card
        '400':
          description: Invalid payment details, empty cart, or invalid reward points.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidDetails:
                  value:
                    error: Invalid payment details
                    details:
                      cardNumber: Invalid card number
                      expiry: Invalid or expired date (MM/YY)
                emptyCart:
                  value:
                    error: Your cart is empty
                notEnoughPoints:
                  value:
                    error: Not enough reward points
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: Payment declined by the (mock) issuing bank.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                declined:
                  value:
                    error: Payment declined by the issuing bank. Please try another method.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------- Orders
  /orders:
    get:
      tags: [Orders]
      operationId: listOrders
      summary: Order history, newest first
      responses:
        '200':
          description: The caller's orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
              examples:
                history:
                  value:
                    items:
                      - id: 2
                        orderNumber: ORD-100002
                        userId: 2
                        items:
                          - bookId: 19
                            title: Atomic Mornings
                            author: Jordan Blake
                            image: /covers/19.svg
                            price: 349
                            quantity: 1
                        subtotal: 349
                        tax: 17.45
                        pointsRedeemed: 0
                        discount: 0
                        total: 366.45
                        status: Delivered
                        paymentMethod: credit_card
                        address:
                          id: 1
                          userId: 2
                          fullName: Asha Verma
                          phone: '9876543210'
                          houseNumber: 42B
                          street: MG Road
                          city: Bengaluru
                          state: Karnataka
                          country: India
                          pincode: '560001'
                          isDefault: true
                        createdAt: '2025-03-02T15:10:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Place an order
      description: |
        Checks that the address and payment belong to the caller, that the payment succeeded and is unused, and that
        the recomputed cart total still equals the paid amount. It then re-checks stock, decrements it, marks the
        payment used, stores the order with an address snapshot, updates the reward-points ledger and clears the
        cart (items saved for later are kept).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            examples:
              order:
                value:
                  addressId: 1
                  paymentId: 1
                  pointsToRedeem: 100
      responses:
        '201':
          description: Order created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
              examples:
                created:
                  value:
                    order:
                      id: 3
                      orderNumber: ORD-100003
                      userId: 2
                      items:
                        - bookId: 1
                          title: The Lantern Keeper
                          author: Maya Ellison
                          image: /covers/1.svg
                          price: 399
                          quantity: 2
                      subtotal: 798
                      tax: 39.9
                      pointsRedeemed: 100
                      discount: 100
                      total: 737.9
                      status: Confirmed
                      paymentMethod: credit_card
                      transactionId: TXN1717234567890123
                      address:
                        id: 1
                        userId: 2
                        fullName: Asha Verma
                        phone: '9876543210'
                        houseNumber: 42B
                        street: MG Road
                        city: Bengaluru
                        state: Karnataka
                        country: India
                        pincode: '560001'
                        isDefault: true
                      estimatedDelivery: '2025-06-05T10:00:00.000Z'
                      createdAt: '2025-06-01T10:00:00.000Z'
                    pointsBalance: 407
                    pointsEarned: 7
                    currency: INR
        '400':
          description: Validation failed or a checkout rule was violated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation:
                  value:
                    error: Validation failed
                    details:
                      addressId: Select a delivery address
                invalidAddress:
                  value:
                    error: Invalid delivery address
                paymentNotVerified:
                  value:
                    error: Payment not verified
                paymentUsed:
                  value:
                    error: Payment already used
                cartChanged:
                  value:
                    error: Cart changed after payment. Please retry checkout.
                stock:
                  value:
                    error: '"The Lantern Keeper" is no longer available in the requested quantity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/preview:
    post:
      tags: [Orders]
      operationId: previewOrder
      summary: Preview checkout totals
      description: |
        Computes subtotal, 5% tax, reward-point discount and the payable amount from the server-side cart.
        1 reward point = 1 INR discount, limited by the point balance and the order total.
        1 point is earned per 100 INR paid.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutPreviewRequest'
            examples:
              withPoints:
                value:
                  pointsToRedeem: 100
      responses:
        '200':
          description: Checkout totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutPreview'
              examples:
                preview:
                  value:
                    items:
                      - bookId: 1
                        title: The Lantern Keeper
                        price: 399
                        quantity: 2
                        image: /covers/1.svg
                    quantity: 2
                    subtotal: 798
                    tax: 39.9
                    total: 837.9
                    pointsRedeemed: 100
                    discount: 100
                    payable: 737.9
                    pointsBalance: 500
                    pointsToEarn: 7
        '400':
          description: Empty cart or invalid reward points.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                emptyCart:
                  value:
                    error: Your cart is empty
                notEnoughPoints:
                  value:
                    error: Not enough reward points
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{id}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Get one order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          example: 3
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Order not found, or it belongs to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value:
                    error: Order not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------- Recommendations
  /recommendations:
    get:
      tags: [Recommendations]
      operationId: getRecommendations
      summary: Recommended books
      description: |
        Authentication is optional. Signed-in users with purchase or view history get books from the categories they
        favour, excluding books they already bought (`basedOn: history`). Everyone else gets popular books
        (`basedOn: popular`). Returns up to 8 in-stock books.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Recommended books.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
              examples:
                popular:
                  summary: Guest or no history
                  value:
                    items: []
                    basedOn: popular
        '500':
          $ref: '#/components/responses/InternalServerError'

  /recommendations/me:
    get:
      tags: [Recommendations]
      operationId: getMyRecommendations
      summary: Recommendations for the signed-in user
      description: Same ranking as `GET /recommendations` but requires login and omits `basedOn`.
      responses:
        '200':
          description: Recommended books.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookItemsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /recommendations/similar/{bookId}:
    get:
      tags: [Recommendations]
      operationId: getSimilarBooks
      summary: Books similar to a given book
      description: Scored by same category and same author, then rating. Returns up to 6; an unknown id returns an empty list.
      security: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          example: 1
      responses:
        '200':
          description: Similar books.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookItemsResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------- Admin
  /admin/stats:
    get:
      tags: [Admin]
      operationId: getAdminStats
      summary: Store statistics
      responses:
        '200':
          description: Totals across the store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStats'
              examples:
                stats:
                  value:
                    totalBooks: 48
                    totalOrders: 2
                    totalUsers: 2
                    revenue: 1280.55
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/books:
    get:
      tags: [Admin]
      operationId: adminListBooks
      summary: List every book (no pagination)
      responses:
        '200':
          description: All books as stored.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/BookRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Admin]
      operationId: adminCreateBook
      summary: Create a book
      description: |
        Unspecified optional fields default to `rating: 0`, `isbn: ''`, `description: ''`, `deliveryDays: 4`.
        The cover is `/covers/default.svg`, and the book is not featured or a bestseller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookInput'
            examples:
              newBook:
                value:
                  title: The Salt Road
                  author: Meera Joshi
                  publisher: Oakleaf Publishing
                  categoryId: 1
                  price: 449
                  stock: 25
                  isbn: 978-1-23456-789-0
                  description: A travelogue across the salt flats.
                  deliveryDays: 3
      responses:
        '201':
          description: The created book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBookResponse'
        '400':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid:
                  value:
                    error: Validation failed
                    details:
                      price: Price must be greater than 0
                      categoryId: Select a valid category
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/books/{id}:
    parameters:
      - $ref: '#/components/parameters/BookId'
    put:
      tags: [Admin]
      operationId: adminUpdateBook
      summary: Update a book
      description: |
        The body is validated with the same rules as create, so every required field must be sent again.
        Only the validated fields and the category name are changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookInput'
            examples:
              reprice:
                value:
                  title: The Salt Road
                  author: Meera Joshi
                  publisher: Oakleaf Publishing
                  categoryId: 1
                  price: 399
                  stock: 20
      responses:
        '200':
          description: The updated book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBookResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Admin]
      operationId: adminDeleteBook
      summary: Delete a book
      description: Also removes the book from every cart and wishlist.
      responses:
        '200':
          description: Book deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                deleted:
                  value:
                    message: Book deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT from `POST /auth/login` (HS256, claims `sub`, `role`, `jti`, `iat`, `exp`).
        Enter only the token; Swagger UI adds the `Bearer ` prefix.

  parameters:
    BookId:
      name: id
      in: path
      required: true
      description: Book id.
      schema:
        type: integer
        minimum: 1
      example: 1
    WishlistBookId:
      name: bookId
      in: path
      required: true
      description: Id of the book on the wishlist.
      schema:
        type: integer
        minimum: 1
      example: 5
    AddressId:
      name: id
      in: path
      required: true
      description: Address id.
      schema:
        type: integer
        minimum: 1
      example: 1

  responses:
    ValidationError:
      description: Validation failed. `details` maps field names to messages.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validation:
              value:
                error: Validation failed
                details:
                  email: Enter a valid email address
    Unauthorized:
      description: Missing, invalid, expired or revoked token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              value:
                error: Authentication required
    Forbidden:
      description: The caller is not an admin.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              value:
                error: Admin access required
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            book:
              value:
                error: Book not found
    AddressNotFound:
      description: Address not found, or it belongs to another user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              value:
                error: Address not found
    TooManyRequests:
      description: Rate limit exceeded. Standard `RateLimit-*` headers are sent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            login:
              summary: Login limiter
              value:
                error: Too many login attempts. Please try again later.
            payment:
              summary: Payment limiter
              value:
                error: Too many payment attempts. Please try again later.
    InternalServerError:
      description: Unexpected server error. The message is always generic; details are only logged server-side.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            serverError:
              value:
                error: Something went wrong. Please try again.

  schemas:
    # ---- common
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable message.
        details:
          type: object
          description: Field-level messages. Present only on validation errors.
          additionalProperties:
            type: string
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    # ---- auth
    User:
      type: object
      description: A user without the password hash.
      required: [id, name, email, role, rewardPoints]
      properties:
        id:
          type: integer
          example: 2
        name:
          type: string
          example: Asha Verma
        email:
          type: string
          format: email
          example: user@bookstore.com
        role:
          type: string
          enum: [customer, admin]
        rewardPoints:
          type: integer
          minimum: 0
          description: Current reward-point balance.
          example: 500
        createdAt:
          type: string
          format: date-time
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 128
        remember:
          type: boolean
          default: false
          description: When `true`, the token lasts 7 days instead of 2 hours.
    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: Signed JWT.
        user:
          $ref: '#/components/schemas/User'

    # ---- books
    Category:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Fiction
        slug:
          type: string
          example: fiction
        color:
          type: string
          example: '#2563EB'
    CategoryWithCount:
      allOf:
        - $ref: '#/components/schemas/Category'
        - type: object
          required: [bookCount]
          properties:
            bookCount:
              type: integer
              minimum: 0
    BookRecord:
      type: object
      description: A book as stored.
      required: [id, title, author, category, categoryId, publisher, price, rating, reviewCount, stock, image]
      properties:
        id:
          type: integer
        title:
          type: string
        author:
          type: string
        category:
          type: string
          description: Category name.
        categoryId:
          type: integer
        publisher:
          type: string
        price:
          type: number
          description: Price in INR.
        rating:
          type: number
          minimum: 0
          maximum: 5
        reviewCount:
          type: integer
          minimum: 0
        stock:
          type: integer
          minimum: 0
        image:
          type: string
          description: Cover path served by the client.
          example: /covers/1.svg
        isbn:
          type: string
        description:
          type: string
        deliveryDays:
          type: integer
          minimum: 1
          maximum: 30
        publishedDate:
          type: string
          format: date
        featured:
          type: boolean
        bestseller:
          type: boolean
    Book:
      description: A book as returned by the public catalog, with derived fields.
      allOf:
        - $ref: '#/components/schemas/BookRecord'
        - type: object
          required: [inStock, expectedDelivery]
          properties:
            inStock:
              type: boolean
              description: '`true` when `stock` is above 0.'
            expectedDelivery:
              type: string
              format: date-time
              description: Today plus `deliveryDays`.
    BookInput:
      type: object
      description: Admin create and update body. Unknown fields are ignored.
      required: [title, author, publisher, categoryId, price, stock]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        author:
          type: string
          minLength: 1
          maxLength: 120
        publisher:
          type: string
          minLength: 1
          maxLength: 120
        categoryId:
          type: integer
          description: Must be an existing category id.
        price:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 100000
        stock:
          type: integer
          minimum: 0
          maximum: 100000
        rating:
          type: number
          minimum: 0
          maximum: 5
        isbn:
          type: string
          maxLength: 20
        description:
          type: string
          maxLength: 2000
        deliveryDays:
          type: integer
          minimum: 1
          maximum: 30
    BookListResponse:
      type: object
      required: [items, page, limit, total, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Book'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    BookSearchResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Book'
        total:
          type: integer
    BookItemsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Book'
    BookDetailsResponse:
      type: object
      required: [book, related, frequentlyBoughtTogether]
      properties:
        book:
          $ref: '#/components/schemas/Book'
        related:
          type: array
          description: Up to 6 similar books.
          items:
            $ref: '#/components/schemas/Book'
        frequentlyBoughtTogether:
          type: array
          description: Up to 3 books often ordered together.
          items:
            $ref: '#/components/schemas/Book'
    BookFacets:
      type: object
      required: [categories, authors, publishers, priceRange]
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        authors:
          type: array
          items:
            type: string
        publishers:
          type: array
          items:
            type: string
        priceRange:
          type: object
          required: [min, max]
          properties:
            min:
              type: number
            max:
              type: number
    AdminBookResponse:
      type: object
      required: [book]
      properties:
        book:
          $ref: '#/components/schemas/BookRecord'
    AdminStats:
      type: object
      required: [totalBooks, totalOrders, totalUsers, revenue]
      properties:
        totalBooks:
          type: integer
        totalOrders:
          type: integer
        totalUsers:
          type: integer
        revenue:
          type: number
          description: Sum of order totals in INR.

    # ---- cart
    CartItem:
      type: object
      required: [id, userId, bookId, quantity, savedForLater, book]
      properties:
        id:
          type: integer
          description: Cart row id, used in `/cart/{id}`.
        userId:
          type: integer
        bookId:
          type: integer
        quantity:
          type: integer
          minimum: 1
          maximum: 10
        savedForLater:
          type: boolean
        book:
          $ref: '#/components/schemas/BookRecord'
    CartSummary:
      type: object
      description: Totals for items that are not saved for later.
      required: [quantity, subtotal, tax, total]
      properties:
        quantity:
          type: integer
        subtotal:
          type: number
        tax:
          type: number
          description: 5% of the subtotal.
        total:
          type: number
          description: Subtotal plus tax.
    CartResponse:
      type: object
      required: [items, summary]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        summary:
          $ref: '#/components/schemas/CartSummary'
    CartRebuyResponse:
      allOf:
        - $ref: '#/components/schemas/CartResponse'
        - type: object
          required: [skipped]
          properties:
            skipped:
              type: array
              description: Titles that were unavailable and not added.
              items:
                type: string
    AddToCartRequest:
      type: object
      required: [bookId]
      properties:
        bookId:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
    UpdateCartRequest:
      type: object
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 10
        savedForLater:
          type: boolean

    # ---- wishlist
    WishlistItem:
      type: object
      required: [id, userId, bookId, addedAt, book]
      properties:
        id:
          type: integer
        userId:
          type: integer
        bookId:
          type: integer
        addedAt:
          type: string
          format: date-time
        book:
          $ref: '#/components/schemas/BookRecord'
    WishlistResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WishlistItem'
    AddToWishlistRequest:
      type: object
      required: [bookId]
      properties:
        bookId:
          type: integer
          minimum: 1

    # ---- addresses
    AddressInput:
      type: object
      required: [fullName, phone, houseNumber, street, city, state, country, pincode]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 80
        phone:
          type: string
          pattern: '^[6-9]\d{9}$'
          description: 10-digit Indian mobile number.
        houseNumber:
          type: string
          maxLength: 40
        street:
          type: string
          minLength: 2
          maxLength: 120
        city:
          type: string
          maxLength: 60
        state:
          type: string
          maxLength: 60
        country:
          type: string
          maxLength: 60
        pincode:
          type: string
          pattern: '^\d{6}$'
        isDefault:
          type: boolean
          description: When `true`, this address becomes the default.
    Address:
      allOf:
        - $ref: '#/components/schemas/AddressInput'
        - type: object
          required: [id, userId, isDefault]
          properties:
            id:
              type: integer
            userId:
              type: integer
            isDefault:
              type: boolean
    AddressListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Address'

    # ---- payment
    PaymentDetails:
      type: object
      description: |
        Fields depend on `method`:
        credit_card / debit_card need `cardNumber`, `cardName`, `expiry`, `cvv`;
        upi needs `upiId`; net_banking needs `bank`; wallet needs `wallet`.
      properties:
        cardNumber:
          type: string
          description: 13-19 digits that pass the Luhn check. Spaces and dashes are ignored.
        cardName:
          type: string
        expiry:
          type: string
          pattern: '^(0[1-9]|1[0-2])/\d{2}$'
          description: MM/YY, valid through the last day of the month.
        cvv:
          type: string
          pattern: '^\d{3,4}$'
        upiId:
          type: string
          example: asha@okbank
        bank:
          type: string
          enum: [HDFC Bank, ICICI Bank, SBI, Axis Bank, Kotak Mahindra Bank]
        wallet:
          type: string
          enum: [PayWallet, QuickPay, MobiCash]
    PaymentRequest:
      type: object
      required: [method]
      properties:
        method:
          type: string
          enum: [credit_card, debit_card, upi, net_banking, wallet]
        details:
          $ref: '#/components/schemas/PaymentDetails'
        pointsToRedeem:
          type: integer
          minimum: 0
          default: 0
          description: Reward points to apply (1 point = 1 INR).
    PaymentResponse:
      type: object
      required: [paymentId, transactionId, amount, status, method]
      properties:
        paymentId:
          type: integer
          description: Pass this to `POST /orders`.
        transactionId:
          type: string
        amount:
          type: number
          description: Amount charged, computed on the server.
        status:
          type: string
          enum: [success]
        method:
          type: string
          enum: [credit_card, debit_card, upi, net_banking, wallet]

    # ---- orders
    CheckoutPreviewRequest:
      type: object
      properties:
        pointsToRedeem:
          type: integer
          minimum: 0
          default: 0
    PreviewItem:
      type: object
      required: [bookId, title, price, quantity]
      properties:
        bookId:
          type: integer
        title:
          type: string
        price:
          type: number
        quantity:
          type: integer
        image:
          type: string
    CheckoutPreview:
      type: object
      required: [items, quantity, subtotal, tax, total, pointsRedeemed, discount, payable, pointsBalance, pointsToEarn]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PreviewItem'
        quantity:
          type: integer
        subtotal:
          type: number
        tax:
          type: number
        total:
          type: number
          description: Subtotal plus tax, before the reward-point discount.
        pointsRedeemed:
          type: integer
          description: Points actually applied (capped by balance and total).
        discount:
          type: number
        payable:
          type: number
          description: Amount to pay after the discount.
        pointsBalance:
          type: integer
        pointsToEarn:
          type: integer
          description: 1 point per 100 INR payable.
    CreateOrderRequest:
      type: object
      required: [addressId, paymentId]
      properties:
        addressId:
          type: integer
          minimum: 1
        paymentId:
          type: integer
          minimum: 1
        pointsToRedeem:
          type: integer
          minimum: 0
          default: 0
          description: Must match the value used for the payment, otherwise the amounts differ and the order is rejected.
    OrderItem:
      type: object
      required: [bookId, title, price, quantity]
      properties:
        bookId:
          type: integer
        title:
          type: string
        author:
          type: string
        image:
          type: string
        price:
          type: number
        quantity:
          type: integer
    Order:
      type: object
      required: [id, userId, items, subtotal, tax, total, status, address, createdAt]
      properties:
        id:
          type: integer
        orderNumber:
          type: string
          example: ORD-100003
        userId:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        subtotal:
          type: number
        tax:
          type: number
        pointsRedeemed:
          type: integer
        discount:
          type: number
        total:
          type: number
          description: Amount paid.
        status:
          type: string
          description: Order status, for example `Confirmed` or `Delivered`.
          example: Confirmed
        paymentMethod:
          type: string
        transactionId:
          type: string
        address:
          $ref: '#/components/schemas/Address'
        estimatedDelivery:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    OrderResponse:
      type: object
      required: [order]
      properties:
        order:
          $ref: '#/components/schemas/Order'
    OrderListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
    CreateOrderResponse:
      type: object
      required: [order, pointsBalance, pointsEarned, currency]
      properties:
        order:
          $ref: '#/components/schemas/Order'
        pointsBalance:
          type: integer
          description: Balance after redemption and earning.
        pointsEarned:
          type: integer
        currency:
          type: string
          example: INR

    # ---- recommendations
    RecommendationResponse:
      type: object
      required: [items, basedOn]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Book'
        basedOn:
          type: string
          enum: [history, popular]
